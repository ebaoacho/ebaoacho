    </circle>
    <circle cx="940" cy="170" r="6.5" fill="#58A6FF" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0 0;-6 6;0 0" dur="6.0s" repeatCount="indefinite"/>
    </circle>
    
    <g>
      <circle cx="587" cy="204" r="16" fill="none" stroke="#00E5A0" stroke-width="1.5" opacity="0">
        <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.12;0.25;0.37;0.5;0.62;0.75;0.87;1" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="r" values="14;19;14" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="587" cy="204" r="7" fill="#00E5A0"/>
      <text x="587" y="191" fill="#00E5A0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" text-anchor="middle" opacity="0.85">#7</text>
    </g>
    <g>
      <circle cx="677" cy="106" r="16" fill="none" stroke="#00E5A0" stroke-width="1.5" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.12;0.25;0.37;0.5;0.62;0.75;0.87;1" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="r" values="14;19;14" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="677" cy="106" r="7" fill="#00E5A0"/>
      <text x="677" y="93" fill="#00E5A0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" text-anchor="middle" opacity="0.85">#10</text>
    </g>
    <g>
      <circle cx="787" cy="190" r="16" fill="none" stroke="#00E5A0" stroke-width="1.5" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.12;0.25;0.37;0.5;0.62;0.75;0.87;1" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="r" values="14;19;14" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="787" cy="190" r="7" fill="#00E5A0"/>
      <text x="787" y="177" fill="#00E5A0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" text-anchor="middle" opacity="0.85">#8</text>
    </g>
    <g>
      <circle cx="887" cy="92" r="16" fill="none" stroke="#00E5A0" stroke-width="1.5" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.12;0.25;0.37;0.5;0.62;0.75;0.87;1" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="r" values="14;19;14" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="887" cy="92" r="7" fill="#00E5A0"/>
      <text x="887" y="79" fill="#00E5A0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" text-anchor="middle" opacity="0.85">#9</text>
    </g>

    <!-- Ball + detection box -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="600 210;600 210;690 112;690 112;800 196;800 196;900 98;900 98;600 210" keyTimes="0;0.12;0.25;0.37;0.5;0.62;0.75;0.87;1" dur="10s" calcMode="spline"
        keySplines="0 0 1 1;.45 0 .25 1;0 0 1 1;.45 0 .25 1;0 0 1 1;.45 0 .25 1;0 0 1 1;.4 0 .2 1" repeatCount="indefinite"/>
      <circle r="4.5" fill="#ffffff"/>
      <rect x="-10" y="-10" width="20" height="20" fill="none" stroke="#FFD166" stroke-width="1.6"/>
      <rect x="10" y="10" width="64" height="14" fill="#FFD166"/>
      <text x="14" y="20.5" fill="#0D1117" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="700">ball 0.97</text>
    </g>

    <!-- HUD -->
    <rect x="520" y="34" width="446" height="26" fill="#000" opacity="0.35"/>
    <circle cx="536" cy="47" r="4" fill="#FF4D4F" class="rec"/>
    <text x="548" y="51" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11">LIVE · ball-detector + possession-estimator</text>
    
      <text x="534" y="272" fill="#00E5A0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" opacity="0">ON-BALL: GREEN #7
        <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.12;0.25;0.37;0.5;0.62;0.75;0.87;1" dur="10s" repeatCount="indefinite"/>
      </text>
      <text x="534" y="272" fill="#00E5A0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" opacity="0">ON-BALL: GREEN #10
        <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.12;0.25;0.37;0.5;0.62;0.75;0.87;1" dur="10s" repeatCount="indefinite"/>
      </text>
      <text x="534" y="272" fill="#00E5A0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" opacity="0">ON-BALL: GREEN #8
        <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.12;0.25;0.37;0.5;0.62;0.75;0.87;1" dur="10s" repeatCount="indefinite"/>
      </text>
      <text x="534" y="272" fill="#00E5A0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" opacity="0">ON-BALL: GREEN #9
        <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.12;0.25;0.37;0.5;0.62;0.75;0.87;1" dur="10s" repeatCount="indefinite"/>
      </text>
  </g>
  <rect x="520" y="34" width="446" height="252" rx="6" fill="none" stroke="#30363D"/>
</svg>
