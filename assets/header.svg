<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Nao Ebata — Computer Vision × Sports Analytics">
  <title>Nao Ebata — Computer Vision × Sports Analytics</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0A2A20"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#00E5A0" stop-opacity="0"/>
      <stop offset="1" stop-color="#00E5A0" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" x2="1">
      <stop offset="0" stop-color="#0E3B2C"/>
      <stop offset="1" stop-color="#0B2F23"/>
    </linearGradient>
    <clipPath id="pitch"><rect x="520" y="34" width="446" height="252" rx="6"/></clipPath>
  </defs>
  <style>
    .fade { animation: fade 1.2s ease-out both; }
    .fade2 { animation: fade 1.2s ease-out 0.35s both; }
    .fade3 { animation: fade 1.2s ease-out 0.7s both; }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .line { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 2.4s ease-out 0.2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .scan { animation: scan 4s linear infinite; }
    @keyframes scan { from { transform: translateX(0); } to { transform: translateX(506px); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .rec { animation: blink 1.4s steps(1) infinite; }
    @keyframes tag0 {
      0%, 0.00% { opacity: 0; transform: translateY(8px); }
      3.00%, 21.00% { opacity: 1; transform: translateY(0); }
      25.00%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    .tag0 { animation: tag0 12.8s ease-in-out infinite; opacity: 0; }
    @keyframes tag1 {
      0%, 24.99% { opacity: 0; transform: translateY(8px); }
      28.00%, 46.00% { opacity: 1; transform: translateY(0); }
      50.00%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    .tag1 { animation: tag1 12.8s ease-in-out infinite; opacity: 0; }
    @keyframes tag2 {
      0%, 49.99% { opacity: 0; transform: translateY(8px); }
      53.00%, 71.00% { opacity: 1; transform: translateY(0); }
      75.00%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    .tag2 { animation: tag2 12.8s ease-in-out infinite; opacity: 0; }
    @keyframes tag3 {
      0%, 74.99% { opacity: 0; transform: translateY(8px); }
      78.00%, 96.00% { opacity: 1; transform: translateY(0); }
      100.00%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    .tag3 { animation: tag3 12.8s ease-in-out infinite; opacity: 0; }
  </style>

  <rect width="1000" height="320" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="319" rx="14" fill="none" stroke="#21262D"/>

  <!-- Left: identity -->
  <g class="fade">
    <text x="48" y="74" fill="#8B949E" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="2">HELLO, WORLD — I'M</text>
  </g>
  <g class="fade2">
    <text x="46" y="136" fill="#E6EDF3" font-family="-apple-system,'Segoe UI','Hiragino Sans','Noto Sans JP',Helvetica,Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="-1">Nao Ebata</text>
    <text x="48" y="170" fill="#8B949E" font-family="-apple-system,'Segoe UI','Hiragino Sans','Noto Sans JP',Helvetica,Arial,sans-serif" font-size="17">江畑 尚 · CV Researcher &amp; Full-stack Engineer</text>
  </g>
  <g>
    <text class="tag0" x="48" y="214" fill="#00E5A0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17">&gt; Computer Vision × Sports Analytics</text>
    <text class="tag1" x="48" y="214" fill="#00E5A0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17">&gt; Finding a 22cm ball on a 105m pitch.</text>
    <text class="tag2" x="48" y="214" fill="#00E5A0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17">&gt; Who has the ball? I teach models to answer.</text>
    <text class="tag3" x="48" y="214" fill="#00E5A0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17">&gt; Research by day. Shipping products by night.</text>
  </g>
  <g class="fade3">
    <rect x="48" y="246" width="190" height="30" rx="15" fill="none" stroke="#00E5A0" stroke-opacity="0.6"/>
    <circle cx="66" cy="261" r="4" fill="#00E5A0" class="rec"/>
    <text x="78" y="266" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13">Kansai Univ. · M2</text>
    <rect x="250" y="246" width="150" height="30" rx="15" fill="none" stroke="#30363D"/>
    <text x="268" y="266" fill="#8B949E" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13">Osaka, Japan</text>
  </g>

  <!-- Right: live tracking demo -->
  <g clip-path="url(#pitch)">
    <rect x="520" y="34" width="446" height="252" fill="url(#grass)"/>
    <rect x="520.0" y="34" width="27.9" height="252" fill="#ffffff" opacity="0.025"/><rect x="575.8" y="34" width="27.9" height="252" fill="#ffffff" opacity="0.025"/><rect x="631.5" y="34" width="27.9" height="252" fill="#ffffff" opacity="0.025"/><rect x="687.2" y="34" width="27.9" height="252" fill="#ffffff" opacity="0.025"/><rect x="743.0" y="34" width="27.9" height="252" fill="#ffffff" opacity="0.025"/><rect x="798.8" y="34" width="27.9" height="252" fill="#ffffff" opacity="0.025"/><rect x="854.5" y="34" width="27.9" height="252" fill="#ffffff" opacity="0.025"/><rect x="910.2" y="34" width="27.9" height="252" fill="#ffffff" opacity="0.025"/>
    <g fill="none" stroke="#3FB98A" stroke-opacity="0.45" stroke-width="1.5">
      <rect class="line" x="528" y="42" width="430" height="236"/>
      <line class="line" x1="743.0" y1="42" x2="743.0" y2="278"/>
      <circle class="line" cx="743.0" cy="160.0" r="34"/>
      <rect class="line" x="528" y="100.0" width="62" height="120"/>
      <rect class="line" x="896" y="100.0" width="62" height="120"/>
    </g>
    <rect class="scan" x="460" y="34" width="60" height="252" fill="url(#scan)"/>
    
    <circle cx="650" cy="150" r="6.5" fill="#58A6FF" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 -6;0 0" dur="3.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="745" cy="160" r="6.5" fill="#58A6FF" opacity="0.9">
